# Keeps the site fresh:
#   1. every 6 hours (and when you press "Run workflow") it runs the scraper,
#   2. commits data/opportunities.json if anything changed,
#   3. publishes the site to GitHub Pages.
# When you push your own changes (e.g. edit custom.json or the page), it skips
# the scraping, just re-merges custom.json, and republishes.

name: Update opportunities

on:
  schedule:
    # Every 6 hours at minute 17 (UTC). 05:47, 11:47, 17:47, 23:47 in India.
    # Not on the hour, because GitHub queues lots of :00 jobs and delays them.
    - cron: "17 */6 * * *"
  workflow_dispatch:        # adds the "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

permissions:
  contents: write           # to commit the updated JSON
  pages: write              # to publish to GitHub Pages
  id-token: write           # required by the Pages deploy action

# Never run two updates at once (they'd fight over the same file).
concurrency:
  group: opportunity-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # the branch's latest commit, not the one that triggered this run
          # (a queued run would otherwise start from an outdated copy)
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Fetch all sources
        if: github.event_name != 'push'
        env:
          # Set these in Settings → Secrets and variables → Actions (see README).
          # If they're missing, the Kaggle source is skipped with a warning.
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python scraper/update.py

      - name: Re-merge custom.json only (you pushed a change)
        if: github.event_name == 'push'
        run: python scraper/update.py --custom-only

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/opportunities.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update opportunities $(date -u +'%Y-%m-%d %H:%M UTC')"
          # In case something was pushed while the scraper was running.
          # opportunities.json is generated, so if both sides changed it,
          # keep the copy we just built ("theirs" = our commit during a rebase).
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}   # pick up the commit the update job just made

      - name: Collect the files the website needs
        run: |
          mkdir _site
          cp -r index.html assets data _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
